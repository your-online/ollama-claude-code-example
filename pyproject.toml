[project]
name = "ollama-claude-code-example"
version = "0.1.0"
description = "A reproducible, local Claude Code + Ollama playground with an independently verifiable SQLite exercise"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[dependency-groups]
dev = ["ruff==0.17.3"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"local_demo/database.py" = ["E501"]
